<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omenala Web3</title>
  <script src="https://jup.ag" defer></script>
  <style>
    body {
      margin: 0;
      background-color: rgb(61 10 23);
      color: rgb(250 246 240 / 0.9);
      font-family: system-ui, sans-serif;
    }
    /* Smooth scaling parameters to lock the terminal window into place nicely on phones */
    #integrated-terminal {
      width: 100%;
      min-width: 280px;
      max-width: 420px;
      height: 540px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin: 24px auto 0 auto;
    }
  </style>
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column;">
    <header style="position: fixed; top: 0; left: 0; width: 100%; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: rgba(61, 10, 23, 0.95); backdrop-filter: blur(8px); z-index: 100; box-sizing: border-box;">
      <span style="font-size: 20px; font-weight: bold; color: #ead5c1; tracking-wider">OMENALA WEB3</span>
      <button id="connect-btn" style="border: 2px solid #ead5c1; background: transparent; color: #ead5c1; padding: 8px 16px; border-radius: 9999px; cursor: pointer; font-weight: bold; font-size: 13px;">CONNECT WALLET</button>
    </header>
    
    <div style="display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; padding: 100px 24px 64px 24px; box-sizing: border-box; width: 100%;">
      <div style="width: 100%; text-align: left; margin-bottom: 20px;">
        <h1 style="font-size: 38px; color: #fff; margin: 0 0 16px 0; line-height: 1.2;">Preserving Culture Through Decentralization</h1>
        <p style="color: rgba(250,246,240,0.7); font-size: 16px; line-height: 1.6; margin: 0 0 20px 0;">Welcome to Omenala, where ancestral legacy converges with Web3 protocols.</p>
        <button id="copy-btn" style="background: #ead5c1; color: #3d0a17; border: none; font-weight: bold; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: 14px;">COPY CA</button>
      </div>
      
      <!-- Container element where the live Jupiter protocol drops in -->
      <div id="integrated-terminal"></div>
    </div>
  </div>

  <script>
    const TOKEN_MINT = "AR4enFoN9vE1v6H2qV5t9X7pL3mK8qR2wT1yU6i89xpump";
    
    function initJupiter() {
      if (window.Jupiter) {
        window.Jupiter.init({ 
          displayMode: "integrated", 
          integratedTargetId: "integrated-terminal", 
          mint: TOKEN_MINT, 
          theme: "dark" 
        });
      }
    }
    
    // Safely verify when the terminal network finishes loading over mobile data
    if (window.Jupiter) {
      initJupiter();
    } else {
      document.addEventListener('jupiterTerminalReady', initJupiter);
      // Extra network heartbeat fallback checker
      setTimeout(initJupiter, 3000);
    }
    
    document.getElementById('connect-btn').addEventListener('click', async () => {
      const provider = window?.solana || window?.phantom?.solana;
      if (provider?.isPhantom) {
        try {
          const res = await provider.connect();
          const addr = res.publicKey.toString();
          document.getElementById('connect-btn').innerText = `${addr.slice(0, 4)}...${addr.slice(-4)}`;
        } catch (err) {
          console.log("Connection closed.");
        }
      } else {
        alert("Please install Phantom or another compatible Web3 wallet extension.");
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(TOKEN_MINT);
      document.getElementById('copy-btn').innerText = "COPIED!";
      setTimeout(() => document.getElementById('copy-btn').innerText = "COPY CA", 2000);
    });
  </script>
</body>
</html>
