<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omenala Web3</title>
  <script src="https://jup.ag" defer></script>
  <style>
    body {
      margin: 0;
      background-color: rgb(61 10 23);
      color: rgb(250 246 240 / 0.9);
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column;">
    <header style="position: fixed; top: 0; width: 100%; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: rgba(61, 10, 23, 0.85);">
      <span style="font-size: 24px; font-weight: bold; color: #ead5c1;">OMENALA WEB3</span>
      <button id="connect-btn" style="border: 2px solid #ead5c1; background: transparent; color: #ead5c1; padding: 8px 24px; border-radius: 9999px; cursor: pointer; font-weight: bold;">CONNECT WALLET</button>
    </header>
    <div style="display: flex; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; padding: 120px 24px 64px 24px; gap: 48px; justify-content: center;">
      <div style="flex: 1; min-width: 300px; max-width: 550px;">
        <h1 style="font-size: 48px; color: #fff; margin: 0 0 24px 0;">Preserving Culture Through Decentralization</h1>
        <p style="color: rgba(250,246,240,0.7); font-size: 18px; line-height: 1.6;">Welcome to Omenala, where ancestral legacy converges with Web3 protocols.</p>
        <button id="copy-btn" style="background: #ead5c1; color: #3d0a17; border: none; font-weight: bold; padding: 10px 20px; border-radius: 12px; cursor: pointer; margin-top: 16px;">COPY CA</button>
      </div>
      <div id="integrated-terminal" style="width: 100%; max-width: 420px; min-height: 500px;"></div>
    </div>
  </div>
  <script>
    const TOKEN_MINT = "AR4enFoN9vE1v6H2qV5t9X7pL3mK8qR2wT1yU6i89xpump";
    function initJupiter() {
      if (window.Jupiter) {
        window.Jupiter.init({ displayMode: "integrated", integratedTargetId: "integrated-terminal", mint: TOKEN_MINT, theme: "dark" });
      }
    }
    window.Jupiter ? initJupiter() : document.addEventListener('jupiterTerminalReady', initJupiter);
    
    document.getElementById('connect-btn').addEventListener('click', async () => {
      const provider = window?.solana || window?.phantom?.solana;
      if (provider?.isPhantom) {
        const res = await provider.connect();
        document.getElementById('connect-btn').innerText = `CONNECTED (${res.publicKey.toString().slice(0, 4)}...)`;
      } else {
        alert("Please install Phantom or another compatible Web3 wallet.");
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(TOKEN_MINT);
      document.getElementById('copy-btn').innerText = "COPIED!";
      setTimeout(() => document.getElementById('copy-btn').innerText = "COPY CA", 2000);
    });
  </script>
</body>
</html>
