<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omenala Web3 — Decentralized Advertising Hub</title>
  <script src="https://jup.ag" defer></script>
  <style>
    body { margin: 0; background-color: #1a020a; color: #faf6f0; font-family: system-ui, sans-serif; }
    .glass-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(234, 213, 193, 0.15); border-radius: 16px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .m-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0, 0, 0, 0.2); border-radius: 10px; margin-bottom: 8px; }
    .m-badge { padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: bold; }
    .act-day { background: #ead5c1; color: #1a020a; }
    .inact-day { background: rgba(255, 255, 255, 0.05); color: rgba(250,246,240,0.4); }
    #integrated-terminal { width: 100%; height: 510px; background: rgba(0, 0, 0, 0.25); border-radius: 14px; margin-top: 16px; }
    .ad-tier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .ad-card { background: rgba(0,0,0,0.3); border: 1px solid rgba(234,213,193,0.1); border-radius: 12px; padding: 12px; text-align: center; }
    .ad-price { font-size: 18px; color: #00ffcc; font-weight: bold; font-family: monospace; margin: 4px 0; }
    .input-field { background: rgba(0,0,0,0.4); border: 1px solid rgba(234,213,193,0.2); border-radius: 8px; padding: 10px; color: #fff; width: 100%; box-sizing: border-box; margin-bottom: 12px; font-size: 13px; }
    .submit-btn { width: 100%; background: #ead5c1; color: #1a020a; border: none; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 13px; }
  </style>
</head>
<body>
  <header style="position: fixed; top: 0; width: 100%; padding: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(26, 2, 10, 0.95); z-index: 1000; box-sizing: border-box;">
    <div style="font-weight: 900; color: #ead5c1;">OMENALA WEB3</div>
    <button id="connect-btn" style="border: 2px solid #ead5c1; background: transparent; color: #ead5c1; padding: 8px 16px; border-radius: 99px; cursor: pointer; font-weight: bold; font-size: 12px;">CONNECT WALLET</button>
  </header>
  <div style="padding: 95px 16px 40px 16px; max-width: 480px; margin: 0 auto;">
    <h1>Preserving Culture Through Decentralization</h1>
    <div class="glass-box">
      <h3 style="color: #ead5c1; font-size: 14px; margin: 0 0 12px 0;">AFAMEFULA COSMOS ORACLE</h3>
      <div class="m-row"><span>EKE GATEWAY</span><span class="m-badge" id="badge-eke">...</span></div>
      <div class="m-row"><span>ORIE GATEWAY</span><span class="m-badge" id="badge-orie">...</span></div>
      <div class="m-row"><span>AFOR GATEWAY</span><span class="m-badge" id="badge-afor">...</span></div>
      <div class="m-row"><span>NKWO GATEWAY</span><span class="m-badge" id="badge-nkwo">...</span></div>
    </div>
    <div class="glass-box">
      <h3 style="color: #ead5c1; font-size: 14px; margin: 0 0 4px 0;">DECENTRALIZED AD IMPRESSIONS</h3>
      <div class="ad-tier-grid">
        <div class="ad-card" id="card-eke"><div>EKE</div><div class="ad-price">50K $OM</div></div>
        <div class="ad-card" id="card-orie"><div>ORIE</div><div class="ad-price">35K $OM</div></div>
        <div class="ad-card" id="card-afor"><div>AFOR</div><div class="ad-price">30K $OM</div></div>
        <div class="ad-card" id="card-nkwo"><div>NKWO</div><div class="ad-price">45K $OM</div></div>
      </div>
    </div>
    <div class="glass-box">
      <h3 style="color: #ead5c1; font-size: 14px; margin: 0 0 12px 0;">LAUNCH AD CAMPAIGN</h3>
      <input type="text" class="input-field" id="ad-banner-url" placeholder="Banner IPFS URL">
      <button class="submit-btn" id="ad-submit-btn">Verify Ad Inventory</button>
    </div>
    <div class="glass-box">
      <div id="integrated-terminal"></div>
    </div>
  </div>
  <script>
    const TOKEN_MINT = "AR4enFoN9vE1v6H2qV5t9X7pL3mK8qR2wT1yU6i89xpump";
    function initJupiter() {
      if (window.Jupiter) window.Jupiter.init({ displayMode: "integrated", integratedTargetId: "integrated-terminal", mint: TOKEN_MINT, theme: "dark" });
    }
    window.addEventListener('jupiterTerminalReady', initJupiter);
    setTimeout(initJupiter, 2000);
  </script>
</body>
</html>
